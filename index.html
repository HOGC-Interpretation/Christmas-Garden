<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圣诞口译词汇训练营 · 我们的圣诞花园</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#FBF8F2; --surface:#FFFFFF; --surface-2:#F4F0E8; --ink:#2E3134; --ink-soft:#62676B; --line:#E7E1D6;
  --sage:#7FA48A; --sage-deep:#4C7659; --sage-soft:#E4EEE6;
  --coral:#E8826A; --coral-deep:#C25E47; --coral-soft:#FBE5DD;
  --blue:#7D9BB5; --blue-deep:#4C6D8A; --blue-soft:#E3EBF3;
  --lav:#A99BC9; --lav-deep:#7262A0; --lav-soft:#ECE7F5;
  --sand:#D6AD72; --sand-deep:#9C7336; --sand-soft:#F6ECDB;
  --teal:#6FA3A0; --teal-deep:#3F7673; --teal-soft:#E0EFEE;
  --ok:#4C8A5D; --ok-soft:#E1F0E4; --err:#C25E47; --err-soft:#FBE5DD;
  --shadow:0 1px 2px rgba(46,49,52,.05),0 8px 24px rgba(46,49,52,.07);
  --shadow-lg:0 2px 4px rgba(46,49,52,.06),0 18px 40px rgba(46,49,52,.12);
  --header:rgba(251,248,242,.9);
  --f-zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-head:"Noto Serif SC","Songti SC","STSong",serif;
  --f-en:"Nunito","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B201F; --surface:#252B2A; --surface-2:#2D3432; --ink:#ECEAE4; --ink-soft:#B4B8B3; --line:#3A4240;
    --sage-soft:#2C3B31; --coral-soft:#46302A; --blue-soft:#2A3745; --lav-soft:#352F46; --sand-soft:#3D3427; --teal-soft:#273A39;
    --sage-deep:#9CC4A7; --coral-deep:#F0A08C; --blue-deep:#A7C1D8; --lav-deep:#C4B8E3; --sand-deep:#E2BF8C; --teal-deep:#97C6C3;
    --ok:#7DBE8D; --ok-soft:#28392C; --err:#F0A08C; --err-soft:#46302A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 18px 40px rgba(0,0,0,.4);
    --header:rgba(27,32,31,.9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B201F; --surface:#252B2A; --surface-2:#2D3432; --ink:#ECEAE4; --ink-soft:#B4B8B3; --line:#3A4240;
  --sage-soft:#2C3B31; --coral-soft:#46302A; --blue-soft:#2A3745; --lav-soft:#352F46; --sand-soft:#3D3427; --teal-soft:#273A39;
  --sage-deep:#9CC4A7; --coral-deep:#F0A08C; --blue-deep:#A7C1D8; --lav-deep:#C4B8E3; --sand-deep:#E2BF8C; --teal-deep:#97C6C3;
  --ok:#7DBE8D; --ok-soft:#28392C; --err:#F0A08C; --err-soft:#46302A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 18px 40px rgba(0,0,0,.4);
  --header:rgba(27,32,31,.9); color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-zh);font-size:16px;line-height:1.7;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--header)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
.en{font-family:var(--f-en)}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:none}

/* header */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--header);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--sage),var(--teal));display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px rgba(79,122,94,.3)}
.brand b{display:block;font-family:var(--f-head);font-size:17px;line-height:1.2}
.brand small{display:block;color:var(--ink-soft);font-size:12px;line-height:1.2}
.hdr-sp{flex:1}
.xp{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--sand-soft);color:var(--sand-deep);font-weight:700;font-size:14px}
.xp .ic{width:16px;height:16px}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;font-size:14px;min-height:40px}
.hbtn:hover{border-color:var(--sage)}
@media (max-width:600px){.brand small,.hbtn span{display:none}.brand b{font-size:15px}.hdr-in{padding:8px 12px}}

main{max-width:1080px;margin:0 auto;padding:22px 16px 70px}
h1,h2,h3{font-family:var(--f-head);line-height:1.35;margin:0}
.page-title{font-size:clamp(24px,4.5vw,32px);margin:4px 0 4px}
.page-sub{color:var(--ink-soft);margin:0 0 20px;max-width:40em}
.backlink{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--ink-soft);padding:4px 0;margin-bottom:6px;font-size:15px}
.backlink:hover{color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 20px;min-height:46px;font-weight:700;font-size:15.5px;background:var(--sage-deep);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .12s,filter .12s}
:root[data-theme="dark"] .btn:not(.ghost),:root[data-theme="dark"] .seg button.on{color:#1B201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost),:root:not([data-theme="light"]) .seg button.on{color:#1B201F}}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.coral{background:var(--coral-deep)}
.btn.blue{background:var(--blue-deep)}
.btn.lav{background:var(--lav-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--sage)}
.btn.sm{min-height:38px;padding:7px 14px;font-size:14px;border-radius:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.chip .ic{width:13px;height:13px}
.c-coral{--c:var(--coral);--cd:var(--coral-deep);--cs:var(--coral-soft)}
.c-lav{--c:var(--lav);--cd:var(--lav-deep);--cs:var(--lav-soft)}
.c-sage{--c:var(--sage);--cd:var(--sage-deep);--cs:var(--sage-soft)}
.c-blue{--c:var(--blue);--cd:var(--blue-deep);--cs:var(--blue-soft)}
.c-sand{--c:var(--sand);--cd:var(--sand-deep);--cs:var(--sand-soft)}
.c-teal{--c:var(--teal);--cd:var(--teal-deep);--cs:var(--teal-soft)}
.chip.cat{background:var(--cs);color:var(--cd)}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;padding:26px clamp(18px,4vw,34px);background:linear-gradient(135deg,var(--sage-soft),var(--blue-soft) 60%,var(--lav-soft));border:0;margin-bottom:18px;overflow:hidden;position:relative}
.hero h1{font-size:clamp(26px,5vw,38px);margin-bottom:6px}
.hero p{color:var(--ink-soft);margin:0 0 16px;max-width:30em}
.hero-art{max-width:300px;justify-self:center;width:100%}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero-art{max-width:200px;order:-1}}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--f-en);font-size:26px;line-height:1.1}
.stat span{color:var(--ink-soft);font-size:13px}
@media (max-width:640px){.stat-strip{grid-template-columns:repeat(2,1fr)}}
.sec-title{font-size:20px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.daily{display:flex;gap:18px;align-items:center;padding:18px 20px;background:var(--coral-soft);border-color:transparent;margin-bottom:6px}
.daily .ico{width:58px;height:58px;border-radius:18px;background:var(--coral);color:#fff;display:grid;place-items:center;flex:none}
.daily .ico .ic{width:28px;height:28px}
.daily h3{font-size:19px}
.daily p{margin:2px 0 0;color:var(--ink-soft);font-size:14.5px}
.daily .grow{flex:1}
@media (max-width:560px){.daily{flex-wrap:wrap}.daily .btn{width:100%}}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:8px;text-align:left;padding:20px;border-radius:22px;border:2px solid transparent;background:var(--cs);color:var(--ink);transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.mode:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--c)}
.mode .m-ico{width:54px;height:54px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center}
.mode .m-ico .ic{width:28px;height:28px}
.mode h3{font-size:21px}
.mode .en-sub{font-family:var(--f-en);font-size:13px;color:var(--cd);font-weight:700;letter-spacing:.02em}
.mode p{margin:0;color:var(--ink-soft);font-size:14.5px}
.mode .go{margin-top:auto;display:inline-flex;align-items:center;gap:4px;color:var(--cd);font-weight:700;font-size:14.5px}
.mode .deco{position:absolute;right:-18px;top:-18px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.12}
.extras{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){.extras{grid-template-columns:repeat(2,1fr)}}
.extra{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.extra:hover{transform:translateY(-2px);border-color:var(--c)}
.extra .x-ico{width:42px;height:42px;border-radius:13px;background:var(--cs);color:var(--cd);display:grid;place-items:center;flex:none}
.extra b{display:block;font-size:15.5px;line-height:1.3}
.extra small{display:block;color:var(--ink-soft);font-size:12.5px;line-height:1.4}
.resume{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:14px;background:var(--sage-soft);border-color:transparent}
.resume .grow{flex:1}

/* audio buttons */
.ab{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;min-height:36px;font-size:13.5px;font-weight:600;color:var(--ink);transition:border-color .15s,background .15s;position:relative}
.ab:hover{border-color:var(--blue)}
.ab .spk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-deep)}
.ab .spk .ic{width:15px;height:15px}
.ab[data-lang="zh"] .spk{background:var(--coral-soft);color:var(--coral-deep)}
.ab.playing{border-color:var(--blue);background:var(--blue-soft)}
.ab[data-lang="zh"].playing{border-color:var(--coral);background:var(--coral-soft)}
.ab.playing .spk{animation:pulse 1s ease-in-out infinite}
.ab .bars{display:none;gap:2px;align-items:flex-end;height:14px}
.ab.playing .bars{display:inline-flex}
.ab .bars i{width:3px;background:currentColor;border-radius:2px;animation:bar .9s ease-in-out infinite}
.ab .bars i:nth-child(2){animation-delay:.15s}.ab .bars i:nth-child(3){animation-delay:.3s}
.ab.unavailable{opacity:.55;border-style:dashed}
.ab:disabled{opacity:.4;cursor:not-allowed}
.ab.big{padding:10px 20px 10px 12px;font-size:15px;min-height:48px}
.ab.big .spk{width:30px;height:30px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes bar{0%,100%{height:4px}50%{height:14px}}

/* flash */
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.deck{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.deck:hover{transform:translateY(-2px);border-color:var(--c,var(--sage))}
.deck b{font-size:16.5px}
.deck small{color:var(--ink-soft)}
.deck:disabled{opacity:.5;cursor:not-allowed;transform:none}
.pbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--c,var(--sage));border-radius:99px;transition:width .6s}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--sage-deep)}
.flash-wrap{max-width:640px;margin:0 auto}
.flash-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.flash-top .pbar{flex:1}
.flash-top .count{font-family:var(--f-en);font-weight:700;color:var(--ink-soft);font-size:14px;white-space:nowrap}
.scene{perspective:1400px}
.fcard{display:grid;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,1.2,.4,1);cursor:pointer;position:relative}
.fcard.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:22px clamp(18px,4vw,30px);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:12px;min-height:360px}
.face.front{background:linear-gradient(160deg,var(--surface) 55%,var(--cs));align-items:center;justify-content:center;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .fhead{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px}
.front .term{font-family:var(--f-en);font-weight:800;font-size:clamp(30px,7vw,46px);line-height:1.15;margin:16px 0 6px;color:var(--ink);letter-spacing:-.01em}
.front .tap{color:var(--ink-soft);font-size:14px;margin-top:auto;display:flex;align-items:center;gap:6px}
.lvl{display:inline-flex;gap:3px;align-items:center;font-size:12px;color:var(--ink-soft)}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--cd)}
.back .zh-term{font-family:var(--f-head);font-size:clamp(26px,6vw,34px);line-height:1.3;color:var(--cd)}
.back .en-term{font-family:var(--f-en);font-weight:700;color:var(--ink-soft);font-size:15px}
.explain{margin:0;font-size:15.5px}
.example{background:var(--surface-2);border-radius:16px;padding:12px 14px;display:grid;gap:6px}
.example .ex-en{font-family:var(--f-en);font-weight:600;font-size:16px;line-height:1.5}
.example .ex-zh{font-size:15.5px;color:var(--ink)}
.note{font-size:14px;color:var(--ink-soft);border-left:3px solid var(--c);padding:2px 0 2px 10px;margin:0}
.note b{color:var(--ink)}
.ref{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--cd);font-weight:500}
.ref .ic{width:14px;height:14px}
.mark-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mark-row .btn{width:100%}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{border-color:var(--sage)}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.iconbtn.on{color:var(--coral-deep);border-color:var(--coral);background:var(--coral-soft)}
.iconbtn.on svg{fill:currentColor}
.slide-in{animation:slideIn .35s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* quiz */
.quiz{max-width:680px;margin:0 auto}
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.q-top .pbar{flex:1}
.q-meta{font-family:var(--f-en);font-weight:700;font-size:14px;color:var(--ink-soft);white-space:nowrap}
.timer{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-en);font-weight:800;font-size:18px;color:var(--coral-deep);padding:4px 12px;border-radius:999px;background:var(--coral-soft)}
.timer.low{animation:pulse .8s infinite}
.q-card{padding:24px clamp(16px,4vw,28px);text-align:center}
.q-kind{margin-bottom:6px}
.q-prompt{font-family:var(--f-en);font-weight:800;font-size:clamp(22px,5vw,32px);line-height:1.3;margin:10px 0}
.q-prompt.sentence{font-size:clamp(18px,4vw,23px);font-weight:700}
.listen-hero{display:flex;flex-direction:column;align-items:center;gap:12px;margin:26px 0 6px}
.play-big{width:96px;height:96px;border-radius:50%;border:0;background:var(--blue-deep);color:#fff;display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.12),0 0 0 10px var(--blue-soft);transition:transform .12s}
.play-big:hover{transform:scale(1.04)}
.play-big .ic{width:40px;height:40px}
.play-big.playing{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 8px 0 rgba(0,0,0,.12),0 0 0 0 rgba(125,155,181,.6)}100%{box-shadow:0 8px 0 rgba(0,0,0,.12),0 0 0 22px rgba(125,155,181,0)}}
:root[data-theme="dark"] .play-big{color:#1B201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .play-big{color:#1B201F}}
.reveal-link{background:none;border:0;color:var(--ink-soft);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.opts{display:grid;gap:10px;margin-top:16px;text-align:left}
.opt{display:flex;gap:12px;align-items:center;padding:13px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:16.5px;line-height:1.5;transition:border-color .12s,transform .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(3px)}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-en);font-weight:800;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.opt.wrong .k{background:var(--err);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:14px 16px;border-radius:16px;text-align:left;animation:pop .3s ease}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--err-soft)}
.fb h4{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:6px}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--err)}
.fb p{margin:2px 0;font-size:14.5px}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.result{padding:30px 22px;text-align:center;max-width:560px;margin:0 auto}
.result .big{font-family:var(--f-en);font-weight:800;font-size:56px;line-height:1;color:var(--sage-deep)}
.stars{display:flex;justify-content:center;gap:6px;margin:12px 0}
.stars .ic{width:38px;height:38px;color:var(--line)}
.stars .ic.on{color:var(--sand);fill:var(--sand);animation:starIn .5s both}
.stars .ic.on:nth-child(2){animation-delay:.15s}.stars .ic.on:nth-child(3){animation-delay:.3s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lvl-card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border-radius:20px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.lvl-card:hover{transform:translateY(-2px);border-color:var(--c)}
.lvl-card.rec{border-color:var(--c);background:var(--cs)}
.lvl-card b{font-size:18px}
.lvl-card small{color:var(--ink-soft);font-size:13.5px}
.lvl-card .best{font-family:var(--f-en);font-weight:700;color:var(--cd);font-size:13.5px;margin-top:auto}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--sand-soft);color:var(--ink);font-size:14px;margin-bottom:14px}
.notice .ic{color:var(--sand-deep);margin-top:3px}

/* interpretation */
.interp-card{padding:22px clamp(16px,4vw,28px)}
.interp-en{font-family:var(--f-en);font-weight:700;font-size:clamp(19px,4.2vw,24px);line-height:1.5;margin:10px 0 14px}
.interp-en.hide{filter:blur(9px);user-select:none}
textarea.attempt{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2);resize:vertical;font-size:16px;line-height:1.6}
textarea.attempt:focus{outline:none;border-color:var(--lav)}
.sugg{margin-top:16px;display:grid;gap:12px;animation:pop .3s ease}
.sugg .main{padding:14px 16px;border-radius:16px;background:var(--lav-soft)}
.sugg .main .lbl,.sugg .alt .lbl{font-size:12.5px;color:var(--lav-deep);font-weight:700;margin-bottom:2px}
.sugg .main p{margin:0;font-size:18px;line-height:1.6;font-family:var(--f-head)}
.sugg .alt{padding:12px 16px;border-radius:16px;border:1.5px dashed var(--lav)}
.sugg .alt p{margin:0;font-size:16px}
mark{background:linear-gradient(transparent 55%,rgba(232,130,106,.35) 55%);color:inherit;padding:0 1px;border-radius:2px}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.key{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:12px;background:var(--surface-2);font-size:14px}
.key .en{font-weight:700}
.self{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.self .btn{width:100%;padding:10px 8px;font-size:14.5px}
@media (max-width:480px){.self{grid-template-columns:1fr}}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:720px;margin:0 auto}
.match-col{display:grid;gap:10px;align-content:start}
.mt{padding:14px 12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:16px;line-height:1.4;min-height:58px;transition:all .15s}
.mt.en{font-weight:700}
.mt:hover:not(:disabled){border-color:var(--teal)}
.mt.sel{border-color:var(--teal-deep);background:var(--teal-soft);transform:scale(1.03)}
.mt.done{border-color:var(--ok);background:var(--ok-soft);opacity:.55;cursor:default}
.mt.bad{border-color:var(--err);background:var(--err-soft);animation:shake .4s}

/* library */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.fchip.on{background:var(--cs,var(--sage-soft));border-color:var(--c,var(--sage));color:var(--cd,var(--sage-deep))}
.search{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;margin-bottom:16px}
.search input{border:0;background:none;flex:1;padding:12px 0;font-size:16px;outline:none}
.lib-list{display:grid;gap:10px}
.lib-item{border-radius:18px;overflow:hidden}
.lib-item summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.lib-item summary::-webkit-details-marker{display:none}
.lib-item .t{flex:1;min-width:0}
.lib-item .t b{font-family:var(--f-en);font-size:17px;display:block;line-height:1.3}
.lib-item .t span{color:var(--ink-soft);font-size:15px}
.lib-item .chev{transition:transform .2s;color:var(--ink-soft)}
.lib-item[open] .chev{transform:rotate(90deg)}
.lib-body{padding:0 16px 16px;display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.status-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.status-dot.known{background:var(--ok)}.status-dot.prac{background:var(--coral)}
.empty{padding:30px;text-align:center;color:var(--ink-soft)}

/* progress */
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.dash{grid-template-columns:repeat(2,1fr)}}
.cat-prog{display:grid;gap:12px;padding:18px}
.cat-prog .r{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font-size:14.5px}
.cat-prog .r .n{font-family:var(--f-en);font-weight:700;text-align:right;color:var(--ink-soft)}
@media (max-width:520px){.cat-prog .r{grid-template-columns:1fr 60px}.cat-prog .r .pbar{grid-column:1/-1;order:3}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 10px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.badge .medal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-soft);position:relative}
.badge .medal .ic{width:28px;height:28px}
.badge.got .medal{background:radial-gradient(circle at 35% 30%,#fff7e6,var(--c));color:#fff;box-shadow:0 0 0 4px var(--cs),0 6px 14px rgba(0,0,0,.12)}
.badge b{font-size:14.5px;line-height:1.3}
.badge small{color:var(--ink-soft);font-size:12px;line-height:1.4}
.badge:not(.got){opacity:.6}

/* toast + modal */
#toasts{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{padding:11px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14.5px;box-shadow:var(--shadow-lg);animation:pop .25s ease;line-height:1.5}
.toast.err{background:var(--err);color:#fff}
.toast.badge-t{background:linear-gradient(135deg,var(--sand),var(--coral));color:#fff;font-weight:700}
.toast.out{opacity:0;transition:opacity .3s}
.ov{position:fixed;inset:0;z-index:90;background:rgba(30,33,32,.45);display:grid;place-items:center;padding:18px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.modal{width:min(520px,100%);max-height:calc(100vh - 36px);overflow:auto;padding:22px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-lg);animation:pop .25s ease}
.modal h2{font-size:21px;margin-bottom:8px}
.voice-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);margin:8px 0;font-size:14px}
.voice-row .grow{flex:1;min-width:0}
.voice-row small{display:block;color:var(--ink-soft);overflow-wrap:anywhere}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-size:14px}
.seg button.on{background:var(--sage-deep);color:#fff}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ================= v2 additions ================= */
/* typography refinements */
body{letter-spacing:.01em;text-rendering:optimizeLegibility;font-weight:400}
h1,h2,h3,.page-title{font-weight:700;letter-spacing:.03em}
.page-sub,.explain,.note,.sugg p,.p-zh{text-wrap:pretty;line-break:strict}
.long-zh{font-size:17px;line-height:1.95;letter-spacing:.02em}

/* navigation */
.topnav{max-width:1080px;margin:0 auto;display:flex;gap:2px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.navlink{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;color:var(--ink-soft);text-decoration:none;font-size:14.5px;font-weight:500;white-space:nowrap}
.navlink .ic{width:16px;height:16px}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink.on{background:var(--sage-soft);color:var(--sage-deep);font-weight:700}
.bottomnav{display:none}
@media (max-width:760px){
  .topnav{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--header);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px env(safe-area-inset-bottom,0px)}
  .bottomnav .navlink{flex-direction:column;gap:2px;font-size:11.5px;padding:5px 0;justify-content:center}
  .bottomnav .navlink .ic{width:21px;height:21px}
  .bottomnav .navlink.on{background:none}
  main{padding-bottom:110px}
  #toasts{bottom:calc(env(safe-area-inset-bottom,0px) + 82px)}
}
.mebtn{border:0;background:none;padding:0;border-radius:50%;display:inline-flex}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.av .ic{width:55%;height:55%}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-soft)}
.sync.ok i{background:var(--ok)}.sync.busy i{background:var(--sand);animation:pulse 1s infinite}.sync.off i{background:var(--err)}
@media (max-width:600px){.sync span{display:none}}

/* resources & level */
.res-row{display:flex;flex-wrap:wrap;gap:8px}
.res{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-family:var(--f-en);font-size:15px}
.res svg{width:20px;height:20px}
.res small{font-family:var(--f-zh);font-weight:500;color:var(--ink-soft);font-size:12.5px}
.welcome{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;padding:22px clamp(18px,4vw,30px);background:linear-gradient(135deg,var(--sage-soft),var(--blue-soft) 65%,var(--lav-soft));border:0;margin-bottom:16px}
.welcome .who{display:flex;gap:16px;align-items:center;flex:1;min-width:260px}
.welcome h1{font-size:clamp(22px,4.5vw,30px)}
.welcome .lvl-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:2px}
.welcome .pts{font-family:var(--f-en);font-weight:800;color:var(--sage-deep)}
.welcome small{color:var(--ink-soft)}
.home-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:16px}
@media (max-width:820px){.home-grid{grid-template-columns:1fr}}
.side-col{display:grid;gap:14px;align-content:start}
.mini-card{padding:16px 18px}
.mini-card h3{font-size:16.5px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.next-unlock{display:flex;gap:12px;align-items:center}
.thumb{width:62px;height:62px;border-radius:16px;background:var(--sage-soft);display:grid;place-items:center;flex:none;overflow:hidden}
.thumb svg{width:100%;height:100%}
.recent{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:14px}
.recent li{display:flex;gap:8px;align-items:center}
.recent li small{color:var(--ink-soft);margin-left:auto;font-family:var(--f-en)}

/* garden */
.garden{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-lg);background:#A9D08F;isolation:isolate}
.garden.mini{border-radius:18px;box-shadow:none}
.garden-bg{position:absolute;inset:0;z-index:-1}
.garden-bg svg{width:100%;height:100%;display:block}
.garden-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(3px,1vw,10px);padding:26% clamp(8px,3vw,28px) clamp(10px,2.5vw,24px)}
.tile{position:relative;aspect-ratio:1;border:0;background:none;padding:0;border-radius:16px;cursor:pointer;transition:transform .15s}
.garden.mini .tile{cursor:default}
.tile::before{content:"";position:absolute;left:10%;right:10%;bottom:3%;height:26%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#9b7350,#6e4e33);opacity:.75}
.tile.empty::before{background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.75);opacity:1}
button.tile:hover{transform:translateY(-2px)}
button.tile:hover.empty::before{background:rgba(255,255,255,.35)}
.tile.sel{background:rgba(255,255,255,.28);box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(232,130,106,.7)}
.tile.target.empty::before{border-color:#FFE08A;background:rgba(255,224,138,.35)}
.tile .art{position:absolute;inset:-6% -6% 2%;display:block;line-height:0;pointer-events:none}
.tile .art svg{width:100%;height:100%;overflow:visible}
.tile.grow .art{animation:grow 1s cubic-bezier(.3,1.6,.4,1)}
@keyframes grow{0%{transform:scale(.55) translateY(10%)}55%{transform:scale(1.18)}100%{transform:none}}
.tile .flag{position:absolute;top:-2px;right:-2px;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:none;animation:bob 1.6s ease-in-out infinite}
.tile .flag svg{width:15px;height:15px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.garden.mini .tile .flag{display:none}
.burst{position:absolute;pointer-events:none;inset:0;z-index:3}
.burst i{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#FFE08A;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.area-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.area-tab{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:500}
.area-tab.on{background:var(--sage-soft);border-color:var(--sage);color:var(--sage-deep);font-weight:700}
.area-tab.locked{opacity:.6}
.area-tab .ic{width:15px;height:15px}
.garden-panel{margin-top:14px;padding:16px 18px}
.garden-panel h3{font-size:18px;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.need-list{display:grid;gap:8px;margin:10px 0}
.need{display:grid;grid-template-columns:24px 64px 1fr auto;gap:10px;align-items:center;font-size:14px}
.need svg{width:22px;height:22px}
.need .pbar{height:8px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px}
.pick{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px}
.pick:hover:not(:disabled){border-color:var(--sage)}
.pick .thumb{width:58px;height:58px;background:var(--sage-soft)}
.pick small{color:var(--ink-soft);font-size:11.5px}
.pick:disabled{opacity:.45;cursor:not-allowed}
.glog{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px;color:var(--ink-soft)}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.gstats{grid-template-columns:repeat(2,1fr)}}

/* unlock roadmap */
.unlock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.unlock{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.unlock .grow{flex:1;min-width:0}
.unlock b{display:block;font-size:15px}
.unlock small{display:block;color:var(--ink-soft);font-size:12.5px;line-height:1.45}
.unlock.locked .thumb svg{filter:grayscale(1) brightness(1.1);opacity:.45}
.unlock .pbar{margin-top:6px;height:7px}
.unlock .done{color:var(--ok);font-size:12.5px;font-weight:700}
.rules{width:100%;border-collapse:collapse;font-size:14px}
.rules td,.rules th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rules th{font-size:13px;color:var(--ink-soft);font-weight:500}
.tbl-wrap{overflow-x:auto}

/* celebration & onboarding */
.celebrate{text-align:center}
.cel-art{width:140px;height:140px;margin:0 auto 8px;animation:celebPop .8s cubic-bezier(.3,1.6,.4,1)}
.cel-art svg{width:100%;height:100%}
@keyframes celebPop{0%{transform:scale(0) rotate(-20deg)}100%{transform:none}}
.gift-line{font-weight:700;color:var(--sand-deep)}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 14px}
.avatar-grid button{border:2px solid transparent;background:none;border-radius:50%;padding:2px;display:grid;place-items:center}
.avatar-grid button.on{border-color:var(--ink)}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-weight:700;font-size:14.5px}
.field input[type=text]{border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface-2);font-size:16px}
.field input[type=text]:focus{outline:none;border-color:var(--sage)}
.field small{color:var(--ink-soft);font-size:12.5px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin:8px 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--sage-deep);flex:none}
.privacy-box{font-size:13.5px;color:var(--ink-soft);background:var(--surface-2);padding:10px 12px;border-radius:12px;margin:10px 0}
.loading{display:grid;place-items:center;gap:12px;min-height:50vh;text-align:center;color:var(--ink-soft)}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--sage-soft);border-top-color:var(--sage-deep);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* passages & recorder */
.steps-bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.steps-bar span{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft)}
.steps-bar span.on{background:var(--lav-soft);color:var(--lav-deep);font-weight:700}
.p-card{padding:20px clamp(16px,4vw,26px);margin-bottom:14px}
.p-card h3{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.p-card h3 .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--lav-deep);color:#fff;font-family:var(--f-en);font-size:13px}
:root[data-theme="dark"] .p-card h3 .n{color:#1B201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-card h3 .n{color:#1B201F}}
.p-en{font-family:var(--f-en);font-weight:600;font-size:clamp(17px,3.6vw,20px);line-height:1.7;padding:14px 16px;border-radius:16px;background:var(--surface-2);margin:0 0 12px;transition:filter .3s}
.p-en.hide{filter:blur(8px);user-select:none}
.p-en-wrap{position:relative}
.p-en-wrap .cover{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.rec{border:1.5px solid var(--line);border-radius:18px;padding:16px;background:var(--surface-2);display:grid;gap:12px}
.rec-main{display:flex;align-items:center;gap:14px}
.rec-main .grow{flex:1;min-width:0}
.rec-note{margin:2px 0 0;font-size:14px;color:var(--ink-soft)}
.rec-privacy{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:12.5px;color:var(--ink-soft)}
.rec-privacy .ic{width:14px;height:14px;margin-top:3px}
.mic{width:68px;height:68px;border-radius:50%;border:0;background:var(--coral-deep);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 5px 0 rgba(0,0,0,.14);transition:transform .12s}
.mic:hover{transform:scale(1.05)}
.mic .ic{width:30px;height:30px}
.mic.on{background:#D64534;animation:micRing 1.4s ease-out infinite}
.mic.wait{opacity:.6;cursor:default}
@keyframes micRing{0%{box-shadow:0 5px 0 rgba(0,0,0,.14),0 0 0 0 rgba(214,69,52,.55)}100%{box-shadow:0 5px 0 rgba(0,0,0,.14),0 0 0 20px rgba(214,69,52,0)}}
:root[data-theme="dark"] .mic{color:#1B201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mic{color:#1B201F}}
.rec-time{font-family:var(--f-en);font-weight:800;font-size:20px}
.rec-dot{width:11px;height:11px;border-radius:50%;background:#D64534;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
canvas.wave{width:100%;height:60px;display:block;border-radius:12px;background:var(--surface)}
.rec-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.player{display:flex;align-items:center;gap:12px}
.player .pp{width:46px;height:46px;border-radius:50%;border:0;background:var(--lav-deep);color:#fff;display:grid;place-items:center;flex:none}
.player .pp.on{background:var(--coral-deep)}
:root[data-theme="dark"] .player .pp{color:#1B201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .player .pp{color:#1B201F}}
.player .track{flex:1;height:10px;border-radius:99px;background:var(--line);cursor:pointer;overflow:hidden}
.player .track i{display:block;height:100%;width:0;background:var(--lav);border-radius:99px}
.notice.err{background:var(--err-soft)}
.notice.err .ic{color:var(--err)}
.ideas{display:grid;gap:6px}
.ideas .check{margin:0;padding:8px 12px;border-radius:12px;background:var(--surface-2)}
.ideas .check:has(input:checked){background:var(--ok-soft)}
.mistake{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;margin:4px 0}
.mistake .ic{color:var(--coral-deep);margin-top:4px;width:16px;height:16px}
.sec-lbl{font-size:13px;font-weight:700;color:var(--lav-deep);margin:4px 0 6px;letter-spacing:.04em}
.rate-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate-row .btn{width:100%;padding:10px 8px;font-size:14.5px;line-height:1.35}
@media (max-width:520px){.rate-row{grid-template-columns:1fr}}
.plist{display:grid;gap:10px}
.pitem{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.pitem:hover{transform:translateY(-2px);border-color:var(--lav)}
.pitem .grow{flex:1;min-width:0}
.pitem b{display:block;font-size:15.5px}
.pitem small{color:var(--ink-soft);font-size:13px}
.pitem .st{font-size:12.5px;font-weight:700;white-space:nowrap}
.st.s2{color:var(--ok)}.st.s1{color:var(--blue-deep)}.st.s0{color:var(--coral-deep)}

/* leaderboard */
.lb-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.lb-tabs .fchip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lb-tabs .fchip .ic{width:15px;height:15px}
.lb-list{display:grid;gap:8px}
.lb-row{display:grid;grid-template-columns:40px 44px 1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.lb-row.top{box-shadow:var(--shadow)}
.lb-row.me{background:var(--sage-soft);border-color:var(--sage)}
.lb-row b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row small{color:var(--ink-soft);font-size:12.5px}
.lb-score{font-family:var(--f-en);font-weight:800;font-size:17px;white-space:nowrap}
.rank{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-en);font-weight:800;background:var(--surface-2);color:var(--ink-soft)}
.rank.r1{background:linear-gradient(135deg,#F8DE8A,#D4A030);color:#5A3D00;box-shadow:0 0 0 3px rgba(212,160,48,.25)}
.rank.r2{background:linear-gradient(135deg,#EEF0F3,#AEB4BC);color:#3E434A;box-shadow:0 0 0 3px rgba(174,180,188,.3)}
.rank.r3{background:linear-gradient(135deg,#F1C5A0,#C07B4C);color:#4A2810;box-shadow:0 0 0 3px rgba(192,123,76,.25)}
.lb-gap{text-align:center;color:var(--ink-soft);font-size:13px;letter-spacing:.3em}
.lb-del{border:0;background:none;color:var(--ink-soft);padding:4px;border-radius:8px}
.lb-del:hover{color:var(--err)}
.lb-foot{font-size:13px;color:var(--ink-soft);margin-top:12px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:18px;background:var(--sand-soft);margin-bottom:14px;font-size:14.5px}
.banner .grow{flex:1;min-width:200px}

/* profile */
.prof-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:22px}
.prof-head h1{font-size:26px}
.prof-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:760px){.prof-grid{grid-template-columns:1fr}}
.prof-card{padding:18px}
.prof-card h3{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.prof-card p{margin:4px 0;font-size:14.5px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-soft)}
#app > div > .garden:not(.mini), #app .garden:not(.mini){max-width:860px;margin-left:auto;margin-right:auto}
@media (max-width:420px){.brand b{font-size:14px;white-space:nowrap}.brand-mark{width:30px;height:30px}.hdr-in{gap:6px}}


/* ================= v3: shared garden ================= */
.av.ch{background:linear-gradient(160deg,#EAF3E4,#D7E8F0);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.av.ch svg{width:100%;height:100%}
.cc{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.cc-left{display:flex;flex-direction:column;align-items:center;gap:8px}
.cc-prev{width:140px;height:190px;border-radius:20px;background:radial-gradient(ellipse at 50% 85%,#CFE6BE,#EEF6E8 60%,#F7F3EA);display:grid;place-items:center;padding:8px}
.cc-prev svg{width:100%;height:100%;animation:idle 2.4s ease-in-out infinite}
.cc-rows{display:grid;gap:10px}
.cc-row{display:grid;gap:4px}
.cc-lbl{font-size:13px;font-weight:700;color:var(--ink-soft)}
.cc-opts{display:flex;flex-wrap:wrap;gap:6px}
.cc-opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 10px;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;min-height:34px}
.cc-opt.on{border-color:var(--sage-deep);background:var(--sage-soft);color:var(--sage-deep);font-weight:700}
.sw{width:18px;height:18px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
@media (max-width:560px){.cc{grid-template-columns:1fr}.cc-prev{width:120px;height:160px}}
.modal.onboard{width:min(640px,100%)}
.prof-char{width:90px;height:120px;display:block}
.prof-char svg{width:100%;height:100%}

.sg-welcome{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;padding:20px 22px;background:linear-gradient(135deg,#EAF4E2,#FBEFE4 70%,#F6E9D2);border:0;margin-bottom:12px}
.sg-welcome h2{font-size:clamp(20px,4vw,26px);margin-bottom:6px}
.sg-welcome p{margin:0;color:var(--ink-soft);line-height:1.8}
.sg-welcome .grow{min-width:0}
.sg-howto{display:grid;gap:8px;font-size:14px;align-content:center}
.sg-howto div{display:flex;gap:8px;align-items:center}
.sg-howto b{width:24px;height:24px;border-radius:50%;background:#C8423B;color:#fff;display:grid;place-items:center;font-size:12.5px;flex:none;font-family:var(--f-en)}
@media (max-width:760px){.sg-welcome{grid-template-columns:1fr}}
:root[data-theme="dark"] .sg-welcome{background:linear-gradient(135deg,#2C3B31,#3D3427)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sg-welcome{background:linear-gradient(135deg,#2C3B31,#3D3427)}}
.sg-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 10px}
.sg-placing{display:flex;gap:10px;align-items:center;padding:6px 8px 6px 6px;border-radius:16px;background:#FFF6D6;border:1.5px solid #F2B84B;color:#4A3A12;font-size:14.5px;font-weight:600}
.sg-scroll{overflow-x:auto;border-radius:24px;box-shadow:var(--shadow-lg);border:1px solid var(--line);-webkit-overflow-scrolling:touch}
.sg-scene{position:relative;min-width:960px;line-height:0;background:#8CC274}
.sg-scene svg.park{width:100%;height:auto;display:block}
@media (min-width:980px){.sg-scene{min-width:0}}
.sg-mini{border-radius:16px;overflow:hidden;line-height:0;border:1px solid var(--line)}
.sg-mini svg{width:100%;height:auto;display:block}
.park .it,.park .orn,.park .slot{cursor:pointer;outline:none}
.park .it:hover,.park .it:focus-visible{filter:drop-shadow(0 0 6px rgba(255,240,180,.95))}
.park .orn:hover,.park .orn:focus-visible{filter:drop-shadow(0 0 5px #fff)}
.park .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.park .pop{animation:popIn .9s cubic-bezier(.3,1.6,.4,1);transform-box:fill-box;transform-origin:50% 100%}
@keyframes popIn{0%{opacity:0;transform:scale(.2) translateY(-30px)}60%{opacity:1;transform:scale(1.25)}100%{transform:none}}
.park .slot circle{animation:slotPulse 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.park .slot:hover circle{fill-opacity:.95}
@keyframes slotPulse{0%,100%{transform:scale(.85)}50%{transform:scale(1.12)}}
.park .tw{animation:twinkle2 2.4s ease-in-out infinite}
@keyframes twinkle2{0%,100%{opacity:1}50%{opacity:.25}}
.park .sparkle{animation:twinkle2 1.8s ease-in-out infinite}
.park .tree-glow{animation:breathe2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe2{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.park .topper{transform-box:fill-box;transform-origin:center;animation:breathe2 3s ease-in-out infinite}
.park .jet{stroke-dasharray:6 6;animation:jet 1s linear infinite}
@keyframes jet{to{stroke-dashoffset:-12}}
.park .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.6s ease-out infinite}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.park .snow{animation:snow linear infinite}
@keyframes snow{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(170px);opacity:0}}
.park .bfly path{transform-box:fill-box;transform-origin:center;animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.35)}}
.park .glow{animation:twinkle2 3s ease-in-out infinite}
.park .fog.reveal{animation:fogOut 2.2s ease forwards}
@keyframes fogOut{to{opacity:0}}
.park .walker{transition:transform 4s linear}
.park .walker .body{transform-box:fill-box;transform-origin:50% 100%;animation:idle 2.6s ease-in-out infinite}
.park .walker.walking .body{animation:step .45s ease-in-out infinite}
.park .walker.flip .body > svg{transform:scaleX(-1);transform-origin:24px 0}
.park .walker .arm-r{transform-box:fill-box;transform-origin:50% 8%}
.park .walker.waving .arm-r{animation:wave .4s ease-in-out 4 alternate}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes step{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-150deg)}}
.sg-card{position:absolute;z-index:5;width:240px;line-height:1.5;padding:12px 14px;border-radius:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-lg);font-size:14px;pointer-events:none;animation:fadeIn .15s ease}
.sg-card.pinned{pointer-events:auto}
.sg-msg{margin-top:6px;padding:6px 10px;border-radius:10px;background:#FFF6D6;color:#5A4520;font-size:13.5px}
.sg-palette{margin-top:12px;padding:16px 18px}
.pick .cost{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;font-family:var(--f-en);font-weight:700;color:var(--ink)}
.pick .cost span{display:inline-flex;align-items:center;gap:1px}
.pick .cost svg{width:14px;height:14px}
.pick .lockhow{color:var(--ink-soft);font-size:11px;line-height:1.35;text-align:center}
.pick.locked .thumb svg{filter:grayscale(1);opacity:.5}
.sg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
@media (max-width:760px){.sg-grid{grid-template-columns:1fr}}
.sg-panel{padding:16px 18px}
.sg-panel h3{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sg-treecard{background:linear-gradient(160deg,var(--surface),#F4F8EE)}
:root[data-theme="dark"] .sg-treecard{background:var(--surface)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sg-treecard{background:var(--surface)}}
.big-line{font-family:var(--f-head);font-size:20px;margin:0;color:#2F6B45}
:root[data-theme="dark"] .big-line{color:var(--sage-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .big-line{color:var(--sage-deep)}}
.sg-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sg-stat{padding:10px;border-radius:14px;background:var(--surface-2)}
.sg-stat b{display:block;font-family:var(--f-en);font-size:22px;line-height:1.2}
.sg-stat span{font-size:12.5px;color:var(--ink-soft)}
.sg-feed{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:340px;overflow:auto}
.sg-feed li{display:flex;gap:10px;align-items:center;font-size:14px}
.sg-feed li .grow{flex:1;min-width:0}
.sg-feed small{color:var(--ink-soft);white-space:nowrap;font-size:12px}
.sg-people{display:flex;flex-wrap:wrap;gap:12px}
.sg-person{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;width:62px;text-align:center;overflow:hidden}
.sg-person span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}
.sg-select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);font-size:15px}
@media (prefers-reduced-motion:reduce){.park .walker{transition:none}}


/* ================= v4: weekly summit ================= */
.mt-wrap{border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid var(--line);margin-bottom:14px}
.mt-scene{position:relative;aspect-ratio:1000/730;min-height:300px;background:#BFE3F7}
.mt-bg{position:absolute;inset:0}
.mt-bg svg{width:100%;height:100%;display:block}
.mt-layer{position:absolute;inset:0}
.mt-cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1100px)}}
.mt-flag{transform-box:fill-box;transform-origin:0 50%;animation:flagWave 1.6s ease-in-out infinite alternate}
@keyframes flagWave{from{transform:skewY(-6deg) scaleX(.92)}to{transform:skewY(5deg) scaleX(1.04)}}
.mt-glow{animation:breathe2 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.climber{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-78%);transition:left 1.3s cubic-bezier(.4,1.2,.5,1),top 1.3s cubic-bezier(.4,1.2,.5,1),opacity .6s;pointer-events:none;width:clamp(70px,13vw,130px)}
.cl-char{width:clamp(36px,7.2vw,66px);aspect-ratio:2/3;animation:idle 2.6s ease-in-out infinite}
.cl-char svg{width:100%;height:100%;overflow:visible}
.climber.r1 .cl-char{width:clamp(42px,8.4vw,78px);animation:cheer 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,220,110,.9))}
@keyframes cheer{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px)}90%{transform:translateY(0)}}
.climber.up .cl-char{animation:hop .5s ease-in-out 3}
@keyframes hop{50%{transform:translateY(-14px)}}
.cl-badge{height:clamp(16px,3.2vw,30px);display:flex;align-items:flex-end;margin-bottom:-2px}
.crown{display:inline-block;width:clamp(24px,4.6vw,44px);filter:drop-shadow(0 0 6px rgba(255,210,90,.9));animation:breathe2 2s ease-in-out infinite}
.crown.sm{width:30px}
.crown svg{width:100%;height:auto;display:block}
.medal{display:inline-grid;place-items:center;width:clamp(18px,3.2vw,28px);height:clamp(18px,3.2vw,28px);border-radius:50%;font-family:var(--f-en);font-weight:800;font-size:clamp(10px,1.7vw,14px);color:#3E434A;background:#E7EAEE;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.medal.m2{background:linear-gradient(135deg,#F4F6F8,#AEB4BC)}
.medal.m3{background:linear-gradient(135deg,#F1C5A0,#C07B4C);color:#4A2810}
.medal.m4,.medal.m5{background:#FFFFFF}
.cl-label{margin-top:2px;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(255,255,255,.94);border-radius:10px;padding:2px 8px 3px;box-shadow:0 2px 6px rgba(0,0,0,.15);max-width:100%;line-height:1.25;color:#2E3134}
.cl-label b{font-size:clamp(11px,1.8vw,15px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-label span{font-family:var(--f-en);font-weight:800;font-size:clamp(10.5px,1.6vw,14px);color:#B4741E}
.climber.r1 .cl-label{background:linear-gradient(180deg,#FFF6D6,#FFE7A0)}
.climber.me .cl-label{outline:2px solid #4C7659}
.mt-empty{position:absolute;transform:translate(-50%,-110%);display:flex;flex-direction:column;align-items:center;padding:4px 10px;border-radius:12px;border:2px dashed rgba(255,255,255,.9);background:rgba(255,255,255,.35);color:#3E4A44;font-size:clamp(10px,1.6vw,13px);line-height:1.3;white-space:nowrap}
.mt-empty small{font-size:.9em;opacity:.8}
.mt-loading{position:absolute;inset:0;min-height:0;background:rgba(255,255,255,.4)}
.mt-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:14px}
@media (max-width:560px){.cl-label b{font-size:12px}.cl-label span{font-size:11.5px}.cl-label{padding:1px 6px 2px}.climber{width:76px}.climber.r5{margin-left:-14px}.climber.r4{margin-left:8px}.mt-empty{font-size:11px}}
@media (max-width:760px){.mt-grid{grid-template-columns:1fr}}
.mt-mine,.mt-list{padding:16px 18px}
.mt-mine h3,.mt-list h3{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mt-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt-rows{display:grid;gap:6px;max-height:420px;overflow:auto}
.mt-row{display:grid;grid-template-columns:36px 36px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:14px;background:var(--surface-2)}
.mt-row.me{background:var(--sage-soft);outline:2px solid var(--sage)}
.mt-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-row .nm small{color:var(--ink-soft);margin-left:4px}
.mt-row b{font-family:var(--f-en)}
.mt-row .rank{width:32px;height:32px;font-size:14px}
.hof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.hof-card{padding:14px 16px}
.hof-week{font-weight:700;font-size:14px;color:var(--sand-deep);margin-bottom:8px}
.hof-podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;flex-wrap:wrap}
.hof-p{display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;text-align:center;font-size:12.5px}
.hof-p b{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hof-p small{color:var(--ink-soft);font-family:var(--f-en);font-weight:700}
.hof-p.p1{order:3}.hof-p.p2{order:2}.hof-p.p3{order:4}.hof-p.p4{order:1}.hof-p.p5{order:5}


/* ================= v5: character creator ================= */
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
.modal.onboard,.modal:has(.cc2){width:min(900px,100%)}
.cc2{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.cc2-stage{display:flex;flex-direction:column;gap:10px;align-items:center;position:sticky;top:0}
.cc2-floor{width:100%;aspect-ratio:5/6;border-radius:22px;background:radial-gradient(ellipse 70% 18% at 50% 88%,#BFDCA9 0 60%,transparent 62%),linear-gradient(180deg,#DCEFF7,#F4F8EC 70%);display:grid;place-items:center;overflow:hidden;position:relative}
.cc2-floor::before{content:"";position:absolute;inset:8% 10% auto;height:30%;background:radial-gradient(circle at 20% 40%,#fff 0 10%,transparent 11%),radial-gradient(circle at 75% 30%,#fff 0 8%,transparent 9%),radial-gradient(circle at 55% 70%,#fff 0 6%,transparent 7%);opacity:.7}
.cc2-prev{width:62%;height:88%;position:relative}
.cc2-prev svg{width:100%;height:100%;overflow:visible;animation:idle 2.6s ease-in-out infinite}
.cc2-prev.swap svg{animation:ccSwap .35s cubic-bezier(.3,1.6,.4,1), idle 2.6s .35s ease-in-out infinite}
@keyframes ccSwap{0%{transform:scale(.92)}60%{transform:scale(1.06)}100%{transform:none}}
.cc2-prev .arm-r{transform-box:fill-box;transform-origin:50% 8%}
.cc2-prev.waving .arm-r{animation:wave .4s ease-in-out 4 alternate}
.cc2-panel{min-width:0}
.cc2-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cc2-tab{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;min-height:38px}
.cc2-tab .ic{width:15px;height:15px}
.cc2-tab.on{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-deep);font-weight:700}
.cc2-body{max-height:390px;overflow:auto;padding:2px 4px 6px 2px}
.cc2-lbl{font-size:13px;font-weight:700;color:var(--ink-soft);margin:6px 0 6px}
.cc2-note{margin:0 0 6px;font-size:12.5px;color:var(--ink-soft)}
.cc2-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.cc2-grid.swatch{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}
.cc2-opt{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:5px 4px;min-height:44px;transition:transform .12s,border-color .12s}
.cc2-opt:hover{border-color:var(--sage);transform:translateY(-1px)}
.cc2-opt.on{border-color:var(--coral-deep);background:var(--coral-soft);box-shadow:0 0 0 2px rgba(232,130,106,.25)}
.cc2-opt small{font-size:11.5px;line-height:1.25;text-align:center;color:var(--ink)}
.cc2-th{width:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(180deg,#EAF4F8,#F4F8EC);display:block;overflow:hidden}
.cc2-grid.body .cc2-th{aspect-ratio:3/4}
.cc2-th svg{width:100%;height:100%;display:block}
.cc2-sw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
@media (max-width:640px){
  .cc2{grid-template-columns:1fr}
  .cc2-stage{position:static;flex-direction:row;justify-content:center}
  .cc2-floor{width:130px;aspect-ratio:3/4}
  .cc2-stage .row{flex-direction:column}
  .cc2-tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .cc2-tab{flex:none}
  .cc2-body{max-height:300px}
  .cc2-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
}

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){ if (c==null || c===false) continue; el.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(String(c)) : c); }
  return el;
}
function rngFrom(seed){ let s = 0; for (const ch of String(seed)) s = (s*31 + ch.charCodeAt(0)) >>> 0; s = s || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return (s % 100000) / 100000; }; }
function shuffle(a, r=Math.random){ const b=a.slice(); for (let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CONFIG = Object.assign({ TREE_MILESTONES:[10,25,45,70], AREA_UNLOCKS:{ fountain:15, market:35, lantern:60, winter:100 }, DAILY_CONTRIBUTION_LIMIT:30 }, window.APP_CONFIG || {});
const GUEST_KEY = 'xmas-interp-vocab-v1';
const CLOUD_CACHE = 'xmas-interp-vocab-cloud:';
const fresh = () => ({ v:3, profile:null, updatedAt:0,
  reviewed:{}, known:{}, practice:{}, fav:{}, wrong:{}, xp:0,
  listen:{ best:{prog:0,easy:0,mid:0,hard:0}, played:0, perfect:0, over80:0, levels:{} },
  interp:{ done:0, success:0, best:{1:0,2:0,3:0}, passages:{} },
  daily:{ last:null, streak:0, bestStreak:0, history:{} }, timedBest:0, matchBest:0, quizzes:0, sessions:0,
  badges:{}, settings:{ accent:'gb', rate:'normal' }, resume:null,
  res:{ water:6, sun:4, seed:2, star:1 }, caps:{}, days:{}, week:{ key:'', pts:0 }, interpPts:0, listenPts:0,
  pstreak:{ last:null, cur:0, best:0 }, unlocked:{}, marks:{}, catBonus:{}, recent:[], results:[], log:[],
  contribCount:0, acts:0, climb:{ week:'', pts:0, acts:0, events:[], keys:[] }, climbHist:{}, catClimb:{}, hofSeen:'', lastSource:'', seenAreas:[], lastGardenVisit:0 });
function migrate(o){
  const f = fresh();
  if (!o || typeof o!=='object') return f;
  const m = Object.assign(f, o);
  m.listen = Object.assign(fresh().listen, o.listen||{}); m.listen.best = Object.assign(fresh().listen.best, (o.listen||{}).best||{}); m.listen.levels = Object.assign({}, (o.listen||{}).levels||{});
  m.interp = Object.assign(fresh().interp, o.interp||{}); m.interp.best = Object.assign({1:0,2:0,3:0}, (o.interp||{}).best||{}); m.interp.passages = Object.assign({}, (o.interp||{}).passages||{});
  m.daily = Object.assign(fresh().daily, o.daily||{}); m.settings = Object.assign(fresh().settings, o.settings||{});
  m.res = Object.assign(o.res ? {water:0,sun:0,seed:0,star:0} : fresh().res, o.res||{});
  m.climb = Object.assign({ week:'', pts:0, acts:0, events:[], keys:[] }, o.climb||{}); if (!Array.isArray(m.climb.events)) m.climb.events = []; if (!Array.isArray(m.climb.keys)) m.climb.keys = [];
  if (!m.climbHist || typeof m.climbHist!=='object') m.climbHist = {}; if (!m.catClimb || typeof m.catClimb!=='object') m.catClimb = {};
  m.week = Object.assign({key:'',pts:0}, o.week||{}); m.pstreak = Object.assign({last:null,cur:0,best:0}, o.pstreak||{});
  ['reviewed','known','practice','fav','wrong','badges','caps','days','unlocked','marks','catBonus'].forEach(k => { if (!m[k] || typeof m[k]!=='object') m[k] = {}; });
  ['recent','results','log','seenAreas'].forEach(k => { if (!Array.isArray(m[k])) m[k] = []; });
  delete m.garden;
  if (m.profile && !m.profile.character) m.profile.character = defaultCharacter();
  m.v = 3;
  return m;
}
function readLocal(key){ try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function writeLocal(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
let P = migrate(readLocal(GUEST_KEY));
const localKey = () => ((Cloud.mode==='cloud' || Cloud.mode==='offline') && Cloud.uid) ? CLOUD_CACHE + Cloud.uid : GUEST_KEY;
function save(){
  finalizeProgress();
  P.updatedAt = Date.now();
  writeLocal(localKey(), P);
  Cloud.schedule();
  updateHeader();
}
function finalizeProgress(){
  if (!P.profile) return;
  checkBadges(); checkUnlocks();
  const keepFrom = dayOffset(-10), keepDays = dayOffset(-120);
  Object.keys(P.caps).forEach(k => { if (k < keepFrom) delete P.caps[k]; });
  Object.keys(P.days).forEach(k => { if (k < keepDays) delete P.days[k]; });
  P.recent = P.recent.slice(0, 12); P.results = P.results.slice(0, 15); P.log = P.log.slice(0, 20);
}
const knownCount = () => Object.keys(P.known).length;
const reviewTotal = () => Object.values(P.reviewed).reduce((a,b)=>a+b,0);
const reviewList = () => ALL.filter(e => P.practice[e.id] || (P.wrong[e.id] && !P.known[e.id]));
const favList = () => ALL.filter(e => P.fav[e.id]);
const catDone = id => { const l = ALL.filter(e=>e.cat===id); return l.length && l.every(e => P.known[e.id]); };
function pushRecent(t){ P.recent.unshift({ d:todayKey(), t }); }
function glog(t){ P.log.unshift({ d:todayKey(), t }); }

/* ---- dates ---- */
function dayOffset(n){ const d = new Date(); d.setDate(d.getDate()+n); return todayKey(d); }
function weekStart(d=new Date()){ const x = new Date(d); x.setDate(x.getDate() - ((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }
const weekKey = () => todayKey(weekStart());
function weekEnd(){ const s = weekStart(); s.setDate(s.getDate()+6); return s; }
function daysSince(key){ if (!key) return 0; const [y,m,d] = String(key).slice(0,10).split('-').map(Number); return Math.max(0, Math.round((new Date().setHours(0,0,0,0) - new Date(y,m-1,d).getTime())/86400000)); }

/* ---- points & rewards (unchanged rules; garden actions never give points) ---- */
const DAILY_CAP = { flash:60, listen:300, interp:400, quiz:200, timed:90, match:60 };
const RES_CAP = { water:80, sun:20, star:6, seed:3 };
const RES_NAME = { water:'水滴', sun:'阳光', seed:'种子', star:'星星' };
const SOURCE_NAME = { flash:'复习词卡', listen:'完成听力挑战', interp:'口译练习', daily:'完成每日挑战', quiz:'完成测验挑战', timed:'完成限时挑战', match:'完成配对游戏', milestone:'达成学习里程碑' };
const DAY_MAX = 1400;
function rollWeek(){ const k = weekKey(); if (P.week.key!==k) P.week = { key:k, pts:0 }; }
function practiceStreak(){ const s = P.pstreak; return (s.last===todayKey() || s.last===dayOffset(-1)) ? s.cur : 0; }
function markPractice(){
  const d = todayKey(), s = P.pstreak;
  if (s.last===d) return;
  s.cur = s.last===dayOffset(-1) ? s.cur+1 : 1; s.last = d; s.best = Math.max(s.best||0, s.cur);
  P.res.sun = (P.res.sun||0) + 1; P.sessions++;
  if (P.days[d]==null) P.days[d] = 0;
  setTimeout(() => toast('今天的第一次练习：阳光 +1'), 600);
}
function earn(kind, pts, res={}, opts={}){
  const d = todayKey();
  const c = P.caps[d] || (P.caps[d] = { pts:{}, res:{} });
  const want = Math.max(0, Math.round(pts||0));
  let p = want;
  if (DAILY_CAP[kind]!=null){ const used = c.pts[kind]||0; p = Math.max(0, Math.min(p, DAILY_CAP[kind]-used)); c.pts[kind] = used + p; }
  const got = {};
  Object.entries(res||{}).forEach(([k,v]) => {
    if (!v) return; let n = v;
    if (!opts.gift && RES_CAP[k]!=null){ const u = c.res[k]||0; n = Math.max(0, Math.min(v, RES_CAP[k]-u)); c.res[k] = u + n; }
    if (n){ P.res[k] = (P.res[k]||0) + n; got[k] = n; }
  });
  if (Object.keys(got).length && SOURCE_NAME[kind]) P.lastSource = SOURCE_NAME[kind];
  if (!opts.noPractice) markPractice();
  if (p){ P.xp += p; rollWeek(); P.week.pts += p; P.days[d] = (P.days[d]||0) + p; if (kind==='interp') P.interpPts += p; if (kind==='listen') P.listenPts += p; }
  return { pts:p, capped: p < want, res:got };
}
function rewardText(r){
  const parts = []; if (r.pts) parts.push(`+${r.pts} 积分`);
  Object.entries(r.res||{}).forEach(([k,v]) => parts.push(`${RES_NAME[k]} +${v}`));
  let s = parts.length ? '获得：' + parts.join(' · ') : '';
  if (r.capped) s += (s ? ' ' : '') + '（今天这项活动的积分已达上限，继续练习仍然很有帮助！）';
  return s;
}
function addXP(n){ earn('other', n); }

/* ---- levels ---- */
const LEVELS = [0,100,250,500,850,1300,1900,2700,3700,5000];
const LEVEL_NAMES = ['新苗','嫩芽','幼苗','小树','绿荫','含苞','花开','结果','繁茂','参天'];
function levelInfo(xp=P.xp){
  let i = 0; while (i+1 < LEVELS.length && xp >= LEVELS[i+1]) i++;
  let lo = LEVELS[i], hi = LEVELS[i+1], lv = i+1;
  if (i===LEVELS.length-1){ const extra = Math.floor((xp-lo)/1500); lv += extra; lo += extra*1500; hi = lo + 1500; }
  return { lv, name: LEVEL_NAMES[i], lo, hi, pct: Math.min(1, (xp-lo)/(hi-lo)) };
}

/* ---- claude.ai 共享数据库 SHARED DATABASE (artifact db + room) ----
   data/users/<id>/state   个人完整进度（只有本人可以读写）
   members/<id>            昵称、人物、加入日期、完成的学习活动次数（大家可读，只有本人可写）
   contributions/<id>      这位成员为花园做的全部贡献（大家可读，只有本人可写，页面拥有者可以管理）
   leaderboard/<id>        选择公开时的排行榜纪录
   config/garden           （选填）圣诞树目标、区域开放条件——页面拥有者可修改
   ------------------------------------------------------------------- */
function withTimeout(p, ms){ return Promise.race([Promise.resolve(p), new Promise((_,rej) => setTimeout(() => rej({ code:'timeout' }), ms))]); }
const clone = o => JSON.parse(JSON.stringify(o));
const Cloud = {
  mode:'local', status:'local', db:null, user:null, room:null, uid:null, isOwner:false, timer:null, writing:false, dirty:false, readOnly:false, retry:0, lbSent:'', memSent:'', lastSync:0,
  available(){ return !!(window.claude && typeof window.claude.use==='function'); },
  configured(){ return this.available(); },
  path(){ return 'data/users/' + this.uid + '/state'; },
  async init(){
    if (!this.available()) return { mode:'local', reason:'standalone' };
    if (this.connecting) return this.connecting;
    this.connecting = (async () => {
      let db = null, user = null;
      for (let k=0; k<3 && (!db || !user); k++){
        try { [db, user] = await withTimeout(Promise.all([window.claude.use('db'), window.claude.use('user')]), 15000); } catch(e){ this.lastError = 'connect:' + ((e && e.code) || 'error'); }
        if ((!db || !user) && k < 2) await new Promise(r => setTimeout(r, 1500));
      }
      if (!db || !user){ this.lastError = this.lastError || 'connect:nodb'; return { mode:'offline', reason:'nodb' }; }
      let uid = null; try { uid = await user.id(); } catch(e){}
      if (!uid){ this.lastError = 'connect:noid'; return { mode:'offline', reason:'noid' }; }
      this.db = db; this.user = user; this.uid = uid; writeLocal('xmas-last-uid', uid);
      try { this.isOwner = !!(await user.isOwner()); } catch(e){}
      if (!this.room) window.claude.use('room').then(r => { this.room = r; if (r && booted && P.profile && Cloud.mode==='cloud') Garden.joinPresence(); }).catch(() => {});
      let snap = null;
      for (let k=0; k<3 && !snap; k++){
        try { snap = await withTimeout(db.doc(this.path()).get(), 15000); } catch(e){ this.lastError = 'read:' + ((e && e.code) || 'error'); if (k < 2) await new Promise(r => setTimeout(r, 2000)); }
      }
      if (!snap) return { mode:'offline', reason:'unreachable' };
      const cloudData = snap.exists ? clone(snap.data()) : null;
      const cache = readLocal(CLOUD_CACHE + uid);
      this.mode = 'cloud'; this.status = 'ok'; this.lastError = '';
      let data = cloudData, dirty = false;
      if (cache && cache.profile && (!cloudData || (cache.updatedAt||0) > (cloudData.updatedAt||0))){ data = cache; dirty = true; }
      if (!this.watching){ this.watching = true; this.watch(); }
      return { mode:'cloud', data, dirty };
    })();
    try { return await this.connecting; } finally { this.connecting = null; }
  },
  retryConnect(){
    if (this.retrying || !this.available()) return;
    this.retrying = true; let delay = 4000;
    const attempt = async () => {
      if (this.mode==='cloud'){ this.retrying = false; return; }
      let r = null; try { r = await this.init(); } catch(e){}
      if (r && r.mode==='cloud'){ this.retrying = false; onReconnected(r); return; }
      delay = Math.min(delay * 1.6, 45000); setTimeout(attempt, delay);
    };
    setTimeout(attempt, delay);
  },
  watch(){
    try {
      this.db.doc(this.path()).onSnapshot(s => {
        if (!s.exists || s.metadata.hasPendingWrites) return;
        const d = s.data();
        if (!d || !P.profile || this.dirty || this.writing) return;
        if ((d.updatedAt||0) > (P.updatedAt||0)){
          P = migrate(clone(d)); writeLocal(localKey(), P); Speech.pick(); updateHeader();
          if (['home','profile','achievements','progress'].includes(currentView())) render();
        }
      }, () => {});
    } catch(e){}
  },
  schedule(){
    if (this.mode!=='cloud' || this.readOnly || !P.profile) return;
    this.dirty = true; this.setStatus('pending');
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1500);
  },
  memberEntry(){ return { nick:P.profile.nick, character:P.profile.character, joined:P.profile.joined, acts:P.acts||0 }; },
  async saveProfile(){

    this.memSent = JSON.stringify(this.memberEntry());
  },
  async flush(){
    if (this.mode!=='cloud' || this.writing || !this.dirty || this.readOnly || !P.profile) return;
    this.writing = true; this.dirty = false; this.setStatus('syncing');
    try {
      await withTimeout(this.db.doc(this.path()).set(clone(P)), 15000);
      if (JSON.stringify(this.memberEntry()) !== this.memSent) await this.saveProfile();
      this.lastSync = Date.now(); this.retry = 0; this.setStatus('ok');
      await this.pushLB();
    } catch(e){
      this.dirty = true;
      const code = e && e.code;
      this.lastError = 'write:' + (code || 'error');
      if (code==='invalid_argument'){ this.readOnly = true; this.setStatus('readonly'); toast('你目前只有查看权限，进度会先保存在这台设备上。请联系管理员把你的权限设为“可以使用”。', 'err'); }

      else { this.lastError = 'write:' + (code || 'error'); this.setStatus('offline'); this.retry = Math.min(this.retry+1, 6); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 2000 * Math.pow(2, this.retry)); }
    }
    this.writing = false;
    if (this.dirty && this.status==='pending'){ clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 800); }
  },
  logActivity(){ if (!P.profile) return; P.acts = (P.acts||0) + 1; },
  lbEntry(){ rollWeek(); rollClimb(); return { climbWeek:P.climb.week, climbPts:P.climb.pts, climbActs:P.climb.acts, hist:climbHistOut(), nick:P.profile.nick, character:P.profile.character, total:P.xp, weekKey:P.week.key, weekPts:P.week.pts, interp:P.interpPts, listen:P.listenPts, streak:practiceStreak(), streakDay:P.pstreak.last||'', level:levelInfo().lv, joined:P.profile.joined }; },
  async pushLB(force){
    if (this.mode!=='cloud' || !P.profile || this.readOnly) return;
    const ref = this.db.doc('leaderboard/' + this.uid);
    if (!P.profile.lb){ if (this.lbSent!=='off'){ try { await ref.delete(); this.lbSent = 'off'; } catch(e){} } return; }
    const e = this.lbEntry(); const sig = JSON.stringify(e);
    if (!force && sig===this.lbSent) return;
    e.updatedAt = Date.now();
    try { await ref.set(e); this.lbSent = sig; } catch(err){}
  },
  async fetchLB(){
    const snap = await withTimeout(this.db.collection('leaderboard').limit(1000).get(), 12000);
    return snap.docs.filter(d => d.exists).map(d => Object.assign({ id:d.id }, d.data()));
  },
  setStatus(s){ this.status = s; updateSync(); }
