/* ======================================================================
   5. 语音 AUDIO — 设备语音 (Web Speech API) + 可选的自备录音
   ====================================================================== */
const EN_PREF = { gb:['Google UK English Female','Google UK English Male','Sonia','Libby','Ryan','Maisie','Serena','Daniel','Kate','Arthur','Martha','Stephanie','Oliver'],
                  us:['Google US English','Aria','Jenny','Guy','Ava','Samantha','Allison','Zoe','Evan','Alex','Nathan'] };
const ZH_PREF = ['Google 普通话','Xiaoxiao','Xiaoyi','Yunxi','Yunjian','Tingting','Ting-Ting','Lilian','Yu-shu','Huihui','Kangkang','Yaoyao','Lili'];
function splitSpeech(text, lang){
  // long passages are spoken sentence by sentence (avoids the browser cutting off long utterances)
  if (text.length < 140) return [text];
  const parts = lang==='zh' ? text.split(/(?<=[。！？；])/) : text.split(/(?<=[.!?;])\s+/);
  return parts.map(s => s.trim()).filter(Boolean);
}
const Speech = {
  ok: typeof window.speechSynthesis!=='undefined' && typeof window.SpeechSynthesisUtterance!=='undefined',
  voices:[], en:null, zh:null, loaded:false, btn:null, audio:null, wd:null,
  init(){
    if (!this.ok){ this.loaded = true; return; }
    const load = () => { let v = []; try { v = speechSynthesis.getVoices() || []; } catch(e){} if (v.length){ this.voices = v; this.loaded = true; this.pick(); } };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch(e){ speechSynthesis.onvoiceschanged = load; }
    setTimeout(load, 600); setTimeout(() => { load(); this.loaded = true; this.apply(); }, 2500);
  },
  norm: l => (l||'').replace('_','-').toLowerCase(),
  rank(list, prefs){
    if (!list.length) return null;
    const score = v => { const i = prefs.findIndex(p => v.name.includes(p)); let s = i<0 ? 0 : 100 - i; if (/natural|neural|enhanced|premium/i.test(v.name)) s += 40; if (/compact|eloquence|novelty/i.test(v.name)) s -= 50; return s; };
    return list.slice().sort((a,b) => score(b)-score(a))[0];
  },
  pick(){
    const n = this.norm, v = this.voices, acc = P.settings.accent;
    if (!v.length) return;
    const want = acc==='us' ? 'en-us' : 'en-gb';
    this.en = this.rank(v.filter(x => n(x.lang).startsWith(want)), EN_PREF[acc]) || this.rank(v.filter(x => n(x.lang).startsWith('en')), EN_PREF.gb.concat(EN_PREF.us));
    this.enExact = !!(this.en && n(this.en.lang).startsWith(want));
    const zhCN = v.filter(x => { const l = n(x.lang); return l==='zh-cn' || l.startsWith('cmn') || l==='zh-hans' || l==='zh-sg' || l==='zh-hans-cn'; });
    this.zh = this.rank(zhCN, ZH_PREF) || this.rank(v.filter(x => n(x.lang)==='zh-tw'), ZH_PREF);
    this.apply();
  },
  has(lang){ if (!this.ok) return false; if (!this.loaded || !this.voices.length) return true; return !!(lang==='en' ? this.en : this.zh); },
  apply(){ $$('.ab').forEach(b => { if (b.dataset.file) return; b.classList.toggle('unavailable', !this.has(b.dataset.lang)); }); },
  mark(btn, on){ if (btn) btn.classList.toggle('playing', on); },
  stop(){
    clearTimeout(this.wd);
    if (this.audio){ try { this.audio.pause(); } catch(e){} this.audio = null; }
    if (this.ok){ try { speechSynthesis.cancel(); } catch(e){} }
    if (this.btn){ this.mark(this.btn, false); this.btn = null; }
  },
  play(text, lang, btn, file){
    const wasBusy = this.ok && (speechSynthesis.speaking || speechSynthesis.pending);
    this.stop(); this.btn = btn;
    if (file){
      const a = new Audio(file); this.audio = a; this.mark(btn, true);
      a.onended = () => this.mark(btn, false);
      const fail = () => { if (this.audio!==a) return; this.mark(btn, false); this.audio = null; this.tts(text, lang, btn, false); };
      a.onerror = fail; a.play().catch(fail);
      return;
    }
    this.tts(text, lang, btn, wasBusy);
  },
  tts(text, lang, btn, delay){
    if (!this.ok){ toast('这个浏览器不支持语音朗读。请使用最新版的 Chrome、Safari 或 Edge。', 'err'); return; }
    const voice = lang==='en' ? this.en : this.zh;
    if (!voice && this.loaded && this.voices.length){
      toast(lang==='en' ? '这台设备找不到英语语音，暂时无法播放。' : '这台设备找不到普通话语音。可在系统设置中添加“中文（中国大陆）”语音后再试。', 'err');
      return;
    }
    const base = P.settings.rate==='slow' ? .72 : .93;
    const us = splitSpeech(text, lang).map(t => {
      const u = new SpeechSynthesisUtterance(t);
      if (voice){ u.voice = voice; u.lang = voice.lang; } else u.lang = lang==='en' ? (P.settings.accent==='us'?'en-US':'en-GB') : 'zh-CN';
      u.rate = lang==='zh' ? base*.95 : base; u.pitch = 1; return u;
    });
    let started = false;
    const last = us[us.length-1];
    us.forEach(u => { u.onstart = () => { started = true; if (this.btn===btn) this.mark(btn, true); }; });
    last.onend = () => { if (this.btn===btn){ this.mark(btn, false); this.btn = null; } clearTimeout(this.wd); };
    us.forEach(u => { u.onerror = e => { this.mark(btn, false); clearTimeout(this.wd); if (e.error!=='interrupted' && e.error!=='canceled') toast(this.voices.length ? '语音播放失败，请再试一次。' : '这台设备没有可用的语音，暂时无法播放。请打开“语音设置”查看详情。', 'err'); }; });
    this.mark(btn, true);
    const go = () => { try { us.forEach(u => speechSynthesis.speak(u)); if (speechSynthesis.paused) speechSynthesis.resume(); } catch(e){ this.mark(btn,false); toast('语音播放失败，请再试一次。','err'); } };
    if (delay) setTimeout(go, 90); else go();
    this.wd = setTimeout(() => { if (!started && this.btn===btn){ this.mark(btn, false); this.btn = null; try { speechSynthesis.cancel(); } catch(e){} toast('没有听到声音？请检查设备音量，或打开“语音设置”试听。'); } }, 5000);
  }
};
function audioBtn(text, lang, label, opts={}){
  const file = opts.file || '';
  const b = h('button',{type:'button', class:'ab'+(opts.big?' big':''), 'data-lang':lang, 'data-file':file||null,
    'aria-label': `播放${lang==='en'?'英语':'普通话'}${label?'：'+label:''}`, title: lang==='en'?'英语发音':'普通话发音'},
    h('span',{class:'spk', html:icon('volume')}), label ? h('span',{}, label) : null, h('span',{class:'bars'}, h('i'),h('i'),h('i')));
  if (!Speech.ok && !file){ b.disabled = true; b.title = '这个浏览器不支持语音朗读'; }
  else if (!file && !Speech.has(lang)) b.classList.add('unavailable');
  b.addEventListener('click', e => { e.stopPropagation(); Speech.play(text, lang, b, file); });
  return b;
}

function toast(msg, type=''){
  const root = $('#toasts'); while (root.children.length >= 2) root.firstChild.remove();
  const t = h('div',{class:'toast '+type, role:'status'}, msg); root.appendChild(t);
  setTimeout(()=>t.classList.add('out'), 3400); setTimeout(()=>t.remove(), 3800);
}
function modal(content, buttons){
  const root = $('#modal'); root.innerHTML = '';
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); setTimeout(nextCeleb, 350); };
  const onKey = e => { if (e.key==='Escape') close(); };
  document.addEventListener('keydown', onKey);
  const box = h('div',{class:'modal', role:'dialog', 'aria-modal':'true'}, content,
    h('div',{class:'row', style:'justify-content:flex-end;margin-top:16px'}, (buttons||[{label:'关闭'}]).map(b => h('button',{type:'button', class:'btn sm '+(b.cls||''), onClick:()=>{ close(); b.onClick && b.onClick(); }}, b.label))));
  const ov = h('div',{class:'ov'}, box); ov.addEventListener('click', e => { if (e.target===ov) close(); });
  root.appendChild(ov); const f = box.querySelector('.modal button:last-child'); f && f.focus();
  return close;
}
function confetti(){
  const c = h('div',{class:'confetti','aria-hidden':'true'}); const cols = ['#E8826A','#7FA48A','#A99BC9','#7D9BB5','#D6AD72'];
  for (let i=0;i<50;i++){ const p = h('i'); p.style.left = Math.random()*100+'%'; p.style.background = cols[i%5]; p.style.animationDuration = (2+Math.random()*2.5)+'s'; p.style.animationDelay = Math.random()*.6+'s'; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(()=>c.remove(), 5500);
}

/* ======================================================================
   12. 题目与测验引擎 QUESTIONS & QUIZ ENGINE
   ====================================================================== */
function makeQ(e, kind, r=Math.random){
  const sentence = kind.endsWith('Sentence');
  const listen = kind.startsWith('listen');
  const correct = sentence ? e.exampleZh : e.zh;
  const opts = [];
  if (sentence && e.exampleDistractors) e.exampleDistractors.forEach(d => opts.push(d));
  // skip entries with the same English term, and (for words) options that overlap in meaning
  const pool = shuffle(ALL.filter(x => x.id!==e.id && x.en.toLowerCase()!==e.en.toLowerCase()), r).sort((a,b) => (b.cat===e.cat) - (a.cat===e.cat));
  const grams = t => { const c = t.replace(/[\s、，。！？/（）()·]/g,''); const g = new Set(); for (let i=0;i<c.length-1;i++) g.add(c.slice(i,i+2)); return g; };
  const cg = grams(correct);
  const overlaps = z => { for (const g of grams(z)) if (cg.has(g)) return true; return false; };
  const need = sentence ? 2 : 3;
  for (const x of pool){
    if (opts.length >= need) break;
    const z = sentence ? x.exampleZh : x.zh;
    if (z===correct || opts.includes(z) || z.includes(correct) || correct.includes(z)) continue;
    if (!sentence && overlaps(z)) continue;
    opts.push(z);
  }
  const options = shuffle([correct, ...opts.slice(0, need)], r);
  return { e, listen, sentence, prompt: sentence ? e.example : e.en, file: fileFor(e, sentence ? 'example' : 'en'), options, answer: options.indexOf(correct) };
}

const LISTEN_LEVELS = [
  { id:'prog', name:'渐进挑战', desc:'从单词到整句，难度逐步提升（推荐）', rec:true },
  { id:'easy', name:'初级 · 单词', desc:'常用的单个词汇' },
  { id:'mid',  name:'中级 · 短语', desc:'教会常用的较长表达' },
  { id:'hard', name:'高级 · 句子', desc:'敬拜、讲道和呼召中的完整句子' }
];
function listenQuestions(level){
  const easy = shuffle(ALL.filter(e => wc(e.en)<=2 && e.level<=2)).slice(0,10).map(e => makeQ(e,'listenWord'));
  const mid  = shuffle(ALL.filter(e => wc(e.en)>=3 || e.level>=2)).slice(0,10).map(e => makeQ(e,'listenWord'));
  const hard = shuffle(ALL).slice(0,10).map(e => makeQ(e,'listenSentence'));
  if (level==='easy') return easy; if (level==='mid') return mid; if (level==='hard') return hard;
  return easy.slice(0,4).concat(mid.filter(q => !easy.slice(0,4).some(x=>x.e.id===q.e.id)).slice(0,3), hard.slice(0,3));
}

      h('b',{}, l.name), h('small',{}, l.desc), h('span',{class:'best'}, `最佳成绩 ${P.listen.best[l.id]||0} / 10` + ((P.listen.levels||{})[l.id] ? ` · 完成 ${P.listen.levels[l.id]} 次` : ''))));
  });

function startListen(l){
  runQuiz({ title:'听力挑战 · '+l.name, color:'c-blue', btnClass:'blue', back:'listen', backLabel:'返回听力挑战', questions:listenQuestions(l.id),
    again:()=>startListen(l),
    onEnd:(s,t) => {
      P.listen.played++; P.listen.levels[l.id] = (P.listen.levels[l.id]||0) + 1;
      const pct = s/t; if (s===t) P.listen.perfect++; if (pct>=.8) P.listen.over80 = (P.listen.over80||0) + 1;
      const nb = s > (P.listen.best[l.id]||0); if (nb) P.listen.best[l.id] = s;
      const mult = { prog:1.2, easy:1, mid:1.2, hard:1.5 }[l.id];
      const res = { water:s, sun: 2 + (pct>=.8 ? 2 : 0) };
      if (l.id==='hard' && pct>=.6) res.star = pct>=.8 ? 2 : 1;
      climb('listen'); const r = earn('listen', Math.round(s*10*mult), res);
      return (nb ? '新的个人最佳成绩！ ' : `个人最佳：${P.listen.best[l.id]} / 10。 `) + rewardText(r);
    } });
}

function recorderUI(key){

      else if (!Rec.supported()) box.appendChild(h('div',{class:'notice', html: icon('info') + '<span>这个浏览器可能不支持录音。你仍然可以出声口译，再对照参考译文。</span>'}));
      box.appendChild(privacy('录音只保存在这台设备的本次浏览中，不会上传，也不会给任何人听。离开或刷新页面后会自动删除。'));
    } else if (mode==='asking'){
      box.append(h('div',{class:'rec-main'}, h('span',{class:'mic wait', html:icon('mic')}), h('div',{class:'grow'}, h('b',{}, '正在请求麦克风权限……'), h('p',{class:'rec-note'}, '请在浏览器弹出的提示中选择“允许”。'))));
    } else if (mode==='recording'){

      stopB.addEventListener('click', stop);

      box.append(h('div',{class:'rec-main'}, stopB, h('div',{class:'grow'}, h('div',{class:'row', style:'gap:8px'}, h('span',{class:'rec-dot'}), h('b',{}, '正在录音'), time), h('p',{class:'rec-note'}, '说完后点击红色按钮停止。最长 3 分钟。'))), cv);
      viz(cv);
      tick = setInterval(() => { const s = (Date.now()-t0)/1000; time.textContent = fmtTime(s); if (s >= 180) stop(); }, 250);
    } else if (mode==='done'){
      const r = Rec.store.get(key);
      box.append(
        h('div',{class:'rec-head'}, h('b',{}, '你的录音'), h('span',{class:'chip'}, '长度 ' + fmtTime(r.dur))),
        player(r),
        h('div',{class:'row'},
          h('button',{type:'button', class:'btn ghost sm', onClick:()=>{ if (audio) audio.pause(); Rec.clear(key); start(); }}, I('mic'), '重新录音'),
          h('button',{type:'button', class:'btn ghost sm', onClick:()=>{ if (audio) audio.pause(); Rec.clear(key); mode = 'idle'; draw(); toast('录音已删除'); }}, I('trash'), '删除录音')),

function highlight(text, terms){
  let out = esc(text);
  terms.filter(Boolean).sort((a,b) => b.length-a.length).forEach(t => {
    const re = new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'i');
    out = out.replace(re, '<mark>$1</mark>');
  });
  return out;
}

  return picked.map((e,i) => makeQ(e, kinds[i % kinds.length], r));

  }
  setTimeout(play, 0);

const CC_TABS = [
  ['face','脸部','user',[['skin','肤色','swatch',CH.skin.map((x,i) => [x, CH.skinName[i]])],['face','表情','head',CH.face]]],
  ['hair','发型','sparkles',[['hair','发型','head',CH.hair]]],

];
function charCreator(initial){
  const start = safeChar(initial || randomCharacter());
  let c = Object.assign({}, start), tab = 'hair';
  const prev = h('div',{class:'cc2-prev'});
  const tabs = h('div',{class:'cc2-tabs', role:'tablist'});
  const body = h('div',{class:'cc2-body'});
  const drawPrev = () => { prev.innerHTML = charSvg(c); prev.classList.remove('swap'); void prev.offsetWidth; prev.classList.add('swap'); };
  const thumb = (k, i, kind) => { const t = Object.assign({}, c, { [k]:i }); if (k==='glassesColor' && !t.glasses) t.glasses = 1; const vb = kind==='head' ? '8 -2 44 44' : kind==='legs' ? '8 50 44 40' : '0 -4 60 94'; return `<svg viewBox="${vb}" aria-hidden="true">${charInner(t)}</svg>`; };
  const drawTabs = () => { tabs.innerHTML = ''; CC_TABS.forEach(([id,label,ic]) => { const b = h('button',{type:'button', role:'tab', 'aria-selected':String(tab===id), class:'cc2-tab' + (tab===id ? ' on' : ''), html: icon(ic) + `<span>${label}</span>`}); b.addEventListener('click', () => { tab = id; drawTabs(); drawBody(); }); tabs.appendChild(b); }); };
  const drawBody = () => {
    body.innerHTML = '';
    const [, , , groups] = CC_TABS.find(t => t[0]===tab);
    groups.forEach(([k, label, kind, opts]) => {
      body.appendChild(h('div',{class:'cc2-lbl'}, label));
      if (k==='bottom' && c.outfit===6) body.appendChild(h('p',{class:'cc2-note'}, '连衣裙已经包含裙子；换成其他上衣，就可以选择下装。'));
      if (k==='bottom' && c.outfit===7) body.appendChild(h('p',{class:'cc2-note'}, '背带裤会使用这里选的下装颜色。'));
      const grid = h('div',{class:'cc2-grid ' + kind, role:'radiogroup', 'aria-label':label});
      opts.forEach((o, i) => {
        const name = Array.isArray(o) ? o[1] : o;
        const b = h('button',{type:'button', class:'cc2-opt' + (c[k]===i ? ' on' : ''), role:'radio', 'aria-checked':String(c[k]===i), title:name, 'aria-label':label + '：' + name},
          kind==='swatch' ? h('span',{class:'cc2-sw', style:`background:${o[0]}`}) : h('span',{class:'cc2-th', html:thumb(k, i, kind)}),
          h('small',{}, name));
        b.addEventListener('click', () => { c[k] = i; if (k==='hatColor' && !c.hat) c.hat = 2; if (k==='accColor' && !c.hairAcc) c.hairAcc = 3; if (k==='glassesColor' && !c.glasses) c.glasses = 1; drawPrev(); drawBody(); });
        grid.appendChild(b);
      });
      body.appendChild(grid);
    });
  };
  const rnd = h('button',{type:'button', class:'btn ghost sm'}, I('shuffle'), '随机搭配');
  rnd.addEventListener('click', () => { c = randomCharacter(); drawPrev(); drawBody(); });
  const reset = h('button',{type:'button', class:'btn ghost sm'}, I('restart'), '重置');
  reset.addEventListener('click', () => { c = Object.assign({}, start); drawPrev(); drawBody(); });
  drawPrev(); drawTabs(); drawBody();
  const wave = setInterval(() => { if (!document.contains(prev)){ clearInterval(wave); return; } prev.classList.add('waving'); setTimeout(() => prev.classList.remove('waving'), 1700); }, 6000);
  const el = h('div',{class:'cc2'},
    h('div',{class:'cc2-stage'}, h('div',{class:'cc2-floor'}, prev), h('div',{class:'row center', style:'gap:8px'}, rnd, reset)),
    h('div',{class:'cc2-panel'}, tabs, body));
  return { el, value:() => Object.assign({}, c) };
}

    if (!Object.entries(it.cost).every(([k,v]) => (P.res[k]||0) >= v)){ toast('资源不足。','err'); return; }
    Object.entries(it.cost).forEach(([k,v]) => { P.res[k] -= v; });
    placing = null;
    try {
      const row = await Garden.add(id, area, slot, msg);
      P.contribCount = (P.contribCount||0) + 1; pushRecent('为花园贡献了' + it.name); glog('贡献了' + it.name);

      Object.entries(it.cost).forEach(([k,v]) => { P.res[k] += v; }); save(); drawAll();

let lbTab = 'total';
const LB_TABS = [['total','总积分','star','分'],['week','本周','calendar','分'],['interp','口译挑战','mic','分'],['listen','听力挑战','headphones','分'],['streak','连续练习','flame','天']];
function lbValue(r, tab){
  if (tab==='total') return r.total||0;
  if (tab==='week') return r.weekKey===weekKey() ? (r.weekPts||0) : 0;
  if (tab==='interp') return r.interp||0;
  if (tab==='listen') return r.listen||0;
  if (tab==='streak') return (r.streakDay===todayKey() || r.streakDay===dayOffset(-1)) ? (r.streak||0) : 0;
  return 0;
}
function lbSane(r){
  const days = daysSince(r.joined) + 1;
  return typeof r.total==='number' && r.total >= 0 && r.total <= days*DAY_MAX + 3000 && (r.weekPts||0) <= 7*DAY_MAX + 3000 && typeof r.nick==='string';
}

function weeklyRows(docs){
  const wk = sgtWeekKey();
  return docs.filter(r => r && typeof r.nick==='string' && r.climbWeek===wk && Number(r.climbPts) > 0 && Number(r.climbPts) <= WEEK_MAX)
    .map(r => ({ id:r.id, nick:String(r.nick).slice(0,12), character:safeChar(r.character), pts:Math.round(Number(r.climbPts)), acts:Number(r.climbActs)||0, at:Number(r.updatedAt)||0 }))
    .sort((a,b) => b.pts - a.pts || a.at - b.at)

function historyWeeks(docs){
  const weeks = {};
  const cur = sgtWeekKey();
  docs.forEach(r => {
    if (!r || typeof r.nick!=='string') return;
    const add = (wk, pts) => { pts = Math.round(Number(pts)); if (wk===cur || !(pts > 0) || pts > WEEK_MAX) return; (weeks[wk] = weeks[wk] || {})[r.id] = { id:r.id, nick:String(r.nick).slice(0,12), character:safeChar(r.character), pts }; };
    if (r.hist && typeof r.hist==='object') Object.entries(r.hist).forEach(([wk,p]) => add(wk, p));
    if (r.climbWeek && r.climbWeek!==cur) add(r.climbWeek, r.climbPts);
  });
  return Object.keys(weeks).sort().reverse().slice(0, 8).map(wk => ({ week:wk, top:Object.values(weeks[wk]).sort((a,b) => b.pts-a.pts).slice(0,5) }));

function weeklyCelebration(docs){

$('#brandMark').innerHTML = icon('languages');

function adoptCloud(res){
  const settings = P.settings;
  if (res.data){ P = migrate(res.data); if (res.dirty){ Cloud.dirty = true; setTimeout(() => Cloud.flush(), 500); } }
  else { P = migrate(null); P.settings = settings; }
}
function onReconnected(res){
  adoptCloud(res); Cloud.setStatus('ok'); Speech.pick();
  if (P.profile){ finalizeProgress(); writeLocal(localKey(), P); }
  Garden.goCloud();
  toast('已连接共享花园！你的进度和大家的贡献都已同步。', 'badge-t');
  booted = true; render();
  if (!P.profile) onboard(); else Garden.ensure().then(() => { Garden.joinPresence(); Garden.migrateLocal(); }).catch(() => {});
}
function showConnecting(){
  $('#app').innerHTML = '';
  const goLocal = h('button',{type:'button', class:'btn ghost sm'}, '先在这台设备上学习');
  goLocal.addEventListener('click', () => { booted = true; Speech.pick(); render(); if (!P.profile) onboard(); toast('你可以先学习。连接到共享花园后，就能保存进度并为花园贡献。'); });
  const tip = h('div',{style:'max-width:32em;display:grid;gap:10px;justify-items:center', hidden:true},
    h('p',{style:'margin:0;font-size:14.5px;line-height:1.7'}, '还连不上吗？请检查网络连接。网络恢复后会自动连接，不需要重新整理。如果一直连不上，请联系管理员。'),
    h('p',{style:'margin:0;font-size:12.5px;color:var(--ink-soft)'}, '（连接代码：' + (Cloud.lastError || '等待中') + '）'),
    goLocal);
  $('#app').appendChild(h('div',{class:'loading'}, h('div',{class:'spinner'}), h('p',{style:'margin:0'}, '正在连接我们的共享花园……'), tip));
  setTimeout(() => { tip.hidden = false; tip.querySelector('p:nth-child(2)').textContent = '（连接代码：' + (Cloud.lastError || '等待中') + '）'; }, 12000);
}
window.addEventListener('online', () => {
  if (!Cloud.available()) return;
  if (Cloud.mode==='cloud'){ Cloud.flush(); Garden.resync(); }
  else Cloud.init().then(r => { if (r && r.mode==='cloud' && Cloud.mode!=='cloud') onReconnected(r); }).catch(() => {});
});
async function boot(){
  if (Cloud.available()){
    const lastUid = readLocal('xmas-last-uid');
    const cached = lastUid ? readLocal(CLOUD_CACHE + lastUid) : null;
    const skipBtn = h('button',{type:'button', class:'btn ghost sm', hidden:true}, '先开始学习（会在背景继续连接）');
    const skipP = new Promise(r => { skipBtn.addEventListener('click', () => r({ mode:'offline', reason:'skipped' })); });
    $('#app').innerHTML = '';
    $('#app').appendChild(h('div',{class:'loading'}, h('div',{class:'spinner'}), h('p',{style:'margin:0'}, '正在进入我们的花园……'), skipBtn));
    if (cached && cached.profile) setTimeout(() => { skipBtn.hidden = false; }, 10000);
    const initP = Cloud.init();
    const res = await Promise.race([initP, skipP]);
    if (res.mode==='cloud') adoptCloud(res);
    else {
      Cloud.mode = 'offline'; Cloud.status = 'offline';
      const uid = Cloud.uid || lastUid;
      if (uid){ Cloud.uid = uid; const c = readLocal(CLOUD_CACHE + uid); if (c && c.profile) P = migrate(c); }
      initP.then(r => { if (r && r.mode==='cloud' && Cloud.mode!=='cloud') onReconnected(r); else Cloud.retryConnect(); }).catch(() => Cloud.retryConnect());
      if (!P.profile){ booted = false; showConnecting(); updateSync(); return; }
      setTimeout(() => toast('暂时连不上共享花园。你可以先学习，进度会先存在这台设备上；连接后会自动同步。', 'err'), 800);
    }
  }
  booted = true;
  Speech.pick();
  if (P.profile){ finalizeProgress(); writeLocal(localKey(), P); }
  render();
  if (!P.profile) onboard();
  else if (Cloud.mode==='cloud' || !Cloud.available()) Garden.ensure().then(() => { Garden.joinPresence(); Garden.migrateLocal(); }).catch(() => {});
}
boot();
